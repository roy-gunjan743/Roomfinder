<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RoomFinder - Last-Minute Classroom Locator</title>
<style>
  :root {
    --bg: #f4f6fb; --card: #fff; --ink: #1c2333; --muted: #6b7385;
    --brand: #4f46e5; --brand-dark: #3730a3; --ok: #16a34a; --bad: #dc2626;
    --line: #e3e7f0;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         background: var(--bg); color: var(--ink); }
  header { background: linear-gradient(135deg, var(--brand), var(--brand-dark));
           color: #fff; padding: 28px 16px 56px; text-align: center; }
  header h1 { margin: 0 0 4px; font-size: 1.9rem; }
  header p { margin: 0; opacity: .85; }
  main { max-width: 960px; margin: -36px auto 40px; padding: 0 16px; }
  .card { background: var(--card); border-radius: 14px; padding: 18px;
          box-shadow: 0 2px 10px rgba(20,30,70,.08); margin-bottom: 16px; }
  .card h2 { margin: 0 0 12px; font-size: 1.1rem; }
  input, button { font: inherit; }
  input { width: 100%; padding: 10px 12px; border: 1px solid var(--line);
          border-radius: 9px; background: #fff; }
  input:focus { outline: 2px solid var(--brand); border-color: transparent; }
  .search { font-size: 1.1rem; padding: 14px 16px; }
  button { background: var(--brand); color: #fff; border: 0; padding: 10px 16px;
           border-radius: 9px; cursor: pointer; font-weight: 600; }
  button:hover { background: var(--brand-dark); }
  button.ghost { background: #eef0ff; color: var(--brand-dark); }
  button.ghost:hover { background: #dfe3ff; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
  .result { border: 1px solid var(--line); border-radius: 12px; padding: 14px; background: #fff; }
  .result h3 { margin: 0 0 2px; }
  .meta { color: var(--muted); font-size: .9rem; }
  .room { display: inline-block; background: #eef0ff; color: var(--brand-dark);
          font-weight: 700; padding: 4px 10px; border-radius: 8px; margin: 8px 0; }
  .dir { font-size: .9rem; margin: 6px 0 10px; }
  .row { display: flex; gap: 8px; }
  .form { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .msg { margin-top: 10px; font-weight: 600; }
  .ok { color: var(--ok); } .bad { color: var(--bad); }
  .warn { background: #fff1f1; border: 1px solid #f5b5b5; color: var(--bad);
          border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; }
  .badge { background: #fee2e2; color: var(--bad); font-size: .75rem; font-weight: 700;
           padding: 2px 8px; border-radius: 99px; margin-left: 6px; }
  ul.history { list-style: none; padding: 0; margin: 0; }
  ul.history li { padding: 8px 0; border-bottom: 1px solid var(--line); font-size: .95rem; }
  ul.history li:last-child { border: 0; }
  .arrow { color: var(--brand); font-weight: 700; }
  .empty { color: var(--muted); }
  footer { text-align: center; color: var(--muted); font-size: .85rem; padding-bottom: 24px; }
</style>
</head>
<body>

<header>
  <h1>RoomFinder</h1>
  <p>The Last-Minute Classroom Locator</p>
</header>

<main>
  <div class="card">
    <input id="q" class="search" type="search"
           placeholder="Search by subject, faculty or class (e.g. Physics, Dr. Roy, CSE-3A)">
  </div>

  <div id="conflicts"></div>

  <div class="card">
    <h2>Rooms</h2>
    <div id="results" class="grid"></div>
  </div>

  <div class="card">
    <h2>Add a class</h2>
    <form id="addForm" class="form">
      <input name="subject"  placeholder="Subject"  required>
      <input name="faculty"  placeholder="Faculty"  required>
      <input name="cls"      placeholder="Class (CSE-3A)" required>
      <input name="building" placeholder="Building" required>
      <input name="room"     placeholder="Room (e.g. 304)" required>
      <input name="slot"     placeholder="Slot (Mon-10AM)" required>
      <button type="submit">Add class</button>
    </form>
    <div id="addMsg" class="msg"></div>
  </div>

  <div class="card">
    <h2>Room-change history</h2>
    <ul id="history" class="history"></ul>
  </div>
</main>

<footer>HTML + CSS + JavaScript frontend &middot; C backend</footer>

<script>
  // The data and all rules (search, conflicts, history) live in the C backend.
  // This page only calls its API.
  const API = location.protocol === "file:" ? "http://localhost:8080" : "";
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  async function post(path, data) {
    const r = await fetch(API + path, {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: new URLSearchParams(data)
    });
    return r.json();
  }

  async function render() {
    try {
      const key = $("q").value.trim();
      const [cd, hd] = await Promise.all([
        fetch(API + "/api/classes?q=" + encodeURIComponent(key)).then(r => r.json()),
        fetch(API + "/api/history").then(r => r.json())
      ]);

      $("conflicts").innerHTML = cd.conflicts.length
        ? `<div class="warn"><b>Conflicting room allocations:</b> ${cd.conflicts.map(esc).join("; ")}</div>`
        : "";

      $("results").innerHTML = cd.classes.length ? cd.classes.map(c => `
        <div class="result">
          <h3>${esc(c.subject)}${c.conflict ? '<span class="badge">CONFLICT</span>' : ""}</h3>
          <div class="meta">${esc(c.faculty)} &middot; ${esc(c.cls)} &middot; ${esc(c.slot)}</div>
          <div class="room">Room ${esc(c.room)}</div>
          <div class="meta">${esc(c.building)}</div>
          <div class="dir">${esc(c.directions)}</div>
          <div class="row">
            <input id="nr${c.id}" placeholder="New room" style="max-width:120px">
            <button class="ghost" onclick="changeRoom(${c.id})">Change room</button>
          </div>
          <div id="m${c.id}" class="msg"></div>
        </div>`).join("") : `<div class="empty">No match found.</div>`;

      $("history").innerHTML = hd.history.length
        ? hd.history.slice().reverse().map(h =>
            `<li><b>${esc(h.subject)}</b> (${esc(h.cls)}): Room ${esc(h.oldRoom)} <span class="arrow">&rarr;</span> Room ${esc(h.newRoom)}
             <span class="meta">&middot; ${esc(h.when)}</span></li>`).join("")
        : `<li class="empty">No room changes yet.</li>`;
    } catch (e) {
      $("conflicts").innerHTML = "";
      $("results").innerHTML = `<div class="warn">Cannot reach the C backend.
        Start it with <b>./server</b> and open <b>http://localhost:8080</b>.</div>`;
    }
  }

  async function changeRoom(id) {
    const msg = $("m" + id);
    try {
      const res = await post("/api/change", { id, room: $("nr" + id).value.trim() });
      if (res.ok) render();
      else { msg.className = "msg bad"; msg.textContent = res.error; }
    } catch (e) { msg.className = "msg bad"; msg.textContent = "Backend not reachable."; }
  }

  $("addForm").addEventListener("submit", async e => {
    e.preventDefault();
    const msg = $("addMsg");
    const f = Object.fromEntries(new FormData(e.target));
    Object.keys(f).forEach(k => f[k] = f[k].trim());
    try {
      const res = await post("/api/add", f);
      if (res.ok) { e.target.reset(); msg.className = "msg ok"; msg.textContent = "Class added."; render(); }
      else { msg.className = "msg bad"; msg.textContent = res.error; }
    } catch (err) { msg.className = "msg bad"; msg.textContent = "Backend not reachable."; }
  });

  $("q").addEventListener("input", render);
  render();
</script>
</body>
</html>
